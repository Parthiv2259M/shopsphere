{% extends "base.html" %}{% block title %}Create account | ShopSphere{% endblock %}
{% block content %}<section class="form-card"><p class="eyebrow">Join the community</p><h1>Create account</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>8+ characters with uppercase, lowercase, number and symbol.</small></label><button class="button">Create account</button></form></section>{% endblock %}
